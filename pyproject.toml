[project]
name = "silencio"
version = "0.1.0"
description = "Silencio — local streaming speech isolation and Music suppression for Windows"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
audio = ["sounddevice>=0.4"]
tray = ["pystray>=0.19", "keyboard>=0.13"]
speech = ["onnxruntime>=1.20,<2", "scipy>=1.14,<2", "sherpa-onnx==1.13.8"]
dev = ["pytest>=8", "mypy>=1.11", "soundfile>=0.13"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
silencio = ["models/*.onnx", "models/*.txt", "models/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "src"
