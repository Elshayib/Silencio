name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/requirements-build.txt
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/set_version.py "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Invalid release tag' }
      - name: Install build dependencies
        run: |
          python -m pip install -r packaging/requirements-build.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python -m pip install --no-deps -e ".[desktop,dev]"
          if ($LASTEXITCODE -ne 0) { throw 'Project installation failed' }
      - name: Locate Inno Setup
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --version=6.7.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          "ISCC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Test and build installer
        run: ./scripts/build_windows.ps1 -LicensedDriver -Python python -Iscc "$env:ISCC"
      - name: Save installer and build evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Silencio-windows-x64
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/Silencio-Setup-*.exe
            dist/Silencio-Setup-*.exe.sha256
            build/frozen-self-test.json
            build/build-environment.json
      - name: Publish tag release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/publish_release.py
